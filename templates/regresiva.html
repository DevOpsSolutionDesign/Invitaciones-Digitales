<section id="bloque-regresiva" class="bloque">
  <img data-field="imgFondo" class="bloque-foto" alt="Fondo" />
  <div class="regresiva-overlay">
    <p data-field="etiqueta" class="regresiva-etiqueta"></p>
    <div class="regresiva-contador" id="regresiva-contador">
      <div class="regresiva-cajas">
        <span id="regresiva-dias">00</span><label>días</label>
      </div>
      <div class="regresiva-cajas">
        <span id="regresiva-horas">00</span><label>horas</label>
      </div>
      <div class="regresiva-cajas">
        <span id="regresiva-min">00</span><label>min</label>
      </div>
      <div class="regresiva-cajas">
        <span id="regresiva-seg">00</span><label>seg</label>
      </div>
    </div>
  </div>
</section>
